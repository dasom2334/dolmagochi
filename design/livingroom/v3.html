<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거실 씬 v3 — 런타임 생성 + canvas</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:18px; background:#1b1020; padding:24px 12px;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
  #stage { width:100%; max-width:900px; aspect-ratio:16/9; border-radius:12px;
           overflow:hidden; background:#241627; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .panel { width:100%; max-width:900px; display:flex; flex-direction:column; gap:8px; }
  .group { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .g-label { width:56px; flex:none; color:#8d7a92; font-size:12px; letter-spacing:.04em; }
  label { padding:5px 12px; border-radius:999px; background:#2a1c31; border:1px solid #443150;
          color:#af9cb4; font-size:12px; line-height:1; cursor:pointer; user-select:none;
          transition:background .15s,color .15s,border-color .15s; }
  label:hover { border-color:#6b5175; }
  label.on { background:#d98e4a; border-color:#d98e4a; color:#2a1626; font-weight:600; }
  .divider { height:1px; background:#2e2036; margin:2px 0; }
  .note { color:#6f5e76; font-size:11px; }
  .slide { display:flex; align-items:center; gap:8px; }
  .slide > span:first-child { width:74px; flex:none; color:#af9cb4; font-size:12px; }
  .slide input { flex:1; max-width:260px; accent-color:#d98e4a; }
  .slide > span:last-child { width:38px; flex:none; color:#8d7a92; font-size:11px;
                             font-variant-numeric:tabular-nums; text-align:right; }
</style>
</head>
<body>
  <div id="stage"><canvas id="cv" width="128" height="72"></canvas></div>
  <div class="panel" id="panel"></div>

  <script type="module">
    import { render, SHOP_PROPS } from './scene/render.js';
    import { reduceMotion } from './scene/anim.js';
    import { AMBIENT } from './scene/lights.js';

    const cv = document.getElementById('cv');
    const state = { time:'sunset', season:'summer', weather:'clear', orb:'sill', tree:'v1',
                    window:'closed', cup:'empty', readBook:1 };
    const off = new Set(SHOP_PROPS);            // 꺼진 레이어 — 상점 소품은 안 산 상태로 시작

    const AXES = [
      ['시간', 'time',    [['day','낮'],['sunset','노을'],['night','밤']]],
      ['계절', 'season',  [['spring','봄'],['summer','여름'],['autumn','가을'],['winter','겨울']]],
      ['날씨', 'weather', [['clear','맑음'],['cloud','구름흐림'],['fog','안개흐림'],
                          ['rain','비'],['downpour','폭우'],
                          ['snow','눈'],['petals','꽃잎·낙엽']]],
      ['돌',   'orb',     [['sill','창턱'],['rug','러그']]],
      ['나무', 'tree',    [['v1','v1 침엽'],['v2','v2 활엽']]],
      ['창문', 'window',  [['closed','닫힘'],['open','열림']]],
      ['찻잔', 'cup',     [['empty','빈 잔'],['full','채움·김']]],
      ['읽는책','readBook',[[0,'없음'],[1,'1권'],[2,'2권'],[3,'3권'],
                          [4,'4권'],[5,'5권'],[6,'6권']]],
    ];
    const TOGGLES = [
      ['색감', [['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                ['light-cloud','구름흐림'],['light-fog','안개흐림'],
                ['light-rain','비'],['light-downpour','폭우'],['light-snow','눈'],
                ['light-petals','꽃잎·낙엽']]],
      ['광원', [['lp-sun','창문 햇빛'],['lp-moon','창문 달빛'],['lp-fire','벽난로'],
                ['lp-lamp','스탠드'],['rim','역광'],['shadow','그림자·비네트']]],
      ['배경', [['g-wall','벽'],['sill-shelf','창턱선반'],['g-floor','바닥'],['g-winframe','창틀'],
                ['g-fireplace','벽난로'],['g-shelf','책장']]],
      ['창밖', [['base-scenery','풍경'],['tree-v1','나무v1'],['tree-v2','나무v2'],
                ['sun','해'],['moon','달'],['stars','별'],['clouds','구름']]],
      ['소품', [['rug','러그'],['orb','창턱 돌'],['orb-rug','러그 돌'],['sill-plant','화분'],
                ['fire','불꽃'],['lamp','스탠드']]],
      ['상점', [['p-cushion','돌 방석'],['p-cup','찻잔'],
                ['p-windchime','풍경']]],
      ['사물', [['p-blanket','담요(개어둠/감쌈)'],['p-waterglass','물컵'],['p-bird','창턱 새'],
                ['rug-mark','돌 자국(그늘)']]],
      ['효과', [['anim','애니메이션']]],
    ];

    const panel = document.getElementById('panel');
    const pills = [];
    const mk = (labelText, items, isAxis, key) => {
      const row = document.createElement('div'); row.className = 'group';
      const l = document.createElement('span'); l.className = 'g-label'; l.textContent = labelText;
      row.append(l);
      for (const [val, txt] of items) {
        const b = document.createElement('label'); b.textContent = txt;
        b.onclick = () => {
          if (isAxis) state[key] = val;
          else off.has(val) ? off.delete(val) : off.add(val);
          draw();
        };
        pills.push([b, isAxis ? () => state[key] === val : () => !off.has(val)]);
        row.append(b);
      }
      panel.append(row);
    };
    // 앰비언트 배분 — 드래그하면서 캔버스를 봐야 하므로 **패널 맨 위**에 둔다.
    // 셋이 하는 일이 서로 다르다:
    //   screen     밝히지만 R·G·B 를 같이 올려 **채도를 깎는다**(뿌예짐)
    //   overlay    밝은 곳은 더 밝게 어두운 곳은 더 어둡게 — **대비**를 벌린다
    //   saturation 명도는 그대로 두고 **채도만** 얹는다(세게 주면 벽이 자홍색이 된다)
    // 오버레이가 아홉 개라 **어느 걸 만지고 있는지**를 항상 띄운다 — 안 그러면
    // 슬라이더를 움직였는데 화면이 안 변할 때(그 오버레이가 꺼져 있을 때) 원인을 못 찾는다.
    const AMB_TARGETS = [['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                         ['light-cloud','구름흐림'],['light-fog','안개흐림'],
                         ['light-rain','비'],['light-downpour','폭우'],
                         ['light-snow','눈'],['light-petals','꽃잎·낙엽']];
    let ambTarget = 'light-day';
    const ambRow = document.createElement('div'); ambRow.className = 'group';
    const ambLab = document.createElement('span'); ambLab.className = 'g-label';
    ambLab.textContent = '앰비언트';
    ambRow.append(ambLab);
    for (const [oid, txt] of AMB_TARGETS) {
      const b = document.createElement('label'); b.textContent = txt;
      b.onclick = () => { ambTarget = oid; syncAmb(); draw(); };
      pills.push([b, () => ambTarget === oid]);
      ambRow.append(b);
    }
    panel.append(ambRow);

    const ambName = document.createElement('div'); ambName.className = 'note';
    panel.append(ambName);

    const AMB = [['screen', 'screen'], ['overlay', 'overlay'], ['saturation', '세츄레이션']];
    const ambInputs = [];
    for (const [key, txt] of AMB) {
      const row = document.createElement('div'); row.className = 'slide';
      const name = document.createElement('span'); name.textContent = txt;
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = 0; inp.max = 0.6; inp.step = 0.01;
      const val = document.createElement('span');
      inp.oninput = () => {
        AMBIENT[ambTarget][key] = +inp.value;
        val.textContent = (+inp.value).toFixed(2);
        draw();
      };
      row.append(name, inp, val);
      panel.append(row);
      ambInputs.push([key, inp, val]);
    }
    /** 대상이 바뀌면 슬라이더를 그 오버레이 값으로 되맞춘다 */
    function syncAmb() {
      const txt = AMB_TARGETS.find(([o]) => o === ambTarget)[1];
      const dim = off.has(ambTarget) ? ' — 지금 꺼져 있어 화면에 안 보인다' : '';
      ambName.textContent = `조정 대상: ${txt} (${ambTarget})${dim}`;
      for (const [key, inp, val] of ambInputs) {
        inp.value = AMBIENT[ambTarget][key];
        val.textContent = AMBIENT[ambTarget][key].toFixed(2);
      }
    }
    syncAmb();
    const div0 = document.createElement('div'); div0.className = 'divider'; panel.append(div0);

    for (const [t, key, items] of AXES) mk(t, items, true, key);
    const div = document.createElement('div'); div.className = 'divider'; panel.append(div);
    for (const [t, items] of TOGGLES) mk(t, items, false);

    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = '지오메트리는 런타임 생성(scene/generate.js) · 색은 팔레트 교체(scene/palette.js) · '
                     + '레이어 합성은 canvas(scene/render.js). 빌드 단계 없음.';
    panel.append(note);

    // prefers-reduced-motion 이면 애니메이션을 끈 채 시작한다
    if (reduceMotion()) off.add('anim');

    let t0 = performance.now(), frozen = 0;
    function draw(t = frozen) {
      render(cv, state, off, t);
      for (const [el, isOn] of pills) el.classList.toggle('on', isOn());
    }
    // 애니메이션이 꺼져도 루프는 돈다 — 색 전환(.6s)은 계속 보여야 하므로
    let paused = false;
    function loop(now) {
      if (!paused) { frozen = now - t0; draw(frozen); }
      requestAnimationFrame(loop);
    }
    draw();
    requestAnimationFrame(loop);
    // 검증용 — at() 로 시간을 지정해 프레임을 재현한다 (pause 해야 루프가 덮어쓰지 않는다)
    window.__scene = { state, off, draw,
      at: (ms) => { frozen = ms; draw(ms); },
      pause: (v = true) => { paused = v; } };
  </script>
</body>
</html>
