<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거실 씬 — 픽셀아트 인터랙티브</title>
<style>
  /* ============================================================
     1. 팔레트 — 노을(기본) = 레퍼런스 원본에서 추출한 값
     ============================================================ */
  .scene {
    --page-bg: #241627;
/*__BASE__*/
    --moon:    #e9e6da;
    --moon-cr: #c8c3b2;
    --star:    #e8ecff;
    --rain:    #c9d4ea;
    --snow-p:  #f4f6fb;
    --out-tint:     rgba(0,0,0,0);
    --weather-tint: rgba(0,0,0,0);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #1b1020;
    padding: 24px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }

  .scene {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 4 / 3;
    background: var(--page-bg);
    border-radius: 12px;
    overflow: hidden;
    transition: background .6s;
  }

  .scene svg {
    display: block;
    width: 100%;
    height: 100%;
    shape-rendering: crispEdges;
  }

  .scene svg * { transition: fill .6s; }

  .scene #moon,
  .scene #stars,
  .scene #rain,
  .scene #snow,
  .scene #tree-bare { display: none; }

  .ctl {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ============================================================
     2. 계절 — 나무 잎(t0~t2) 색만 교체. 여름=기본(원본).
     ============================================================ */
  #s-spring:checked ~ .scene { --t0: #8a5570; --t1: #c087a4; --t2: #dba8be; }
  #s-autumn:checked ~ .scene { --t0: #7a3a28; --t1: #b0622e; --t2: #d08a3a; }
  #s-winter:checked ~ .scene #leaves    { display: none; }
  #s-winter:checked ~ .scene #tree-bare { display: inline; }

  /* ============================================================
     3. 시간대 — 낮 / (노을=기본) / 밤
     ============================================================ */
  #t-day:checked ~ .scene {
    --page-bg: #332138;
/*__DAY__*/
    --k0: #4a90c8; --k1: #62a5d6; --k2: #7ab5e0; --k3: #93c6ea;
    --k4: #aed6f0; --k5: #c8e4f6; --k6: #ddeefa;
    --sun0: #ffdf8f; --sun1: #fff6d8;
    --out-tint: rgba(200,225,255,.14);
  }
  #t-night:checked ~ .scene {
    --page-bg: #150e1d;
/*__NIGHT__*/
    --k0: #0e1430; --k1: #131a3a; --k2: #1a2348; --k3: #232e56;
    --k4: #2c3862; --k5: #364471; --k6: #41507e;
    --out-tint: rgba(10,14,40,.38);
  }
  #t-night:checked ~ .scene #sun   { display: none; }
  #t-night:checked ~ .scene #moon  { display: inline; }
  #t-night:checked ~ .scene #stars { display: inline; }

  /* 언덕: 노을=원본(기본). 낮은 계절색, 밤은 실루엣, 겨울은 눈빛 유지 */
  #t-day:checked ~ #s-spring:checked ~ .scene { --h0: #55804a; --h1: #6f9c5e; --h2: #8fba7c; --h3: #c2dfa6; }
  #t-day:checked ~ #s-summer:checked ~ .scene { --h0: #4c8544; --h1: #63a058; --h2: #84bc74; --h3: #b8d898; }
  #t-day:checked ~ #s-autumn:checked ~ .scene { --h0: #7a4a2e; --h1: #9a6538; --h2: #c08850; --h3: #e0b070; }
  #t-day:checked ~ #s-winter:checked ~ .scene { --h0: #8f9ab0; --h1: #b5c0d0; --h2: #d8e0ec; --h3: #eef2f8; }
  #t-night:checked ~ .scene { --h0: #12172f; --h1: #1a2140; --h2: #242c52; --h3: #303a64; }
  #t-sunset:checked ~ #s-winter:checked ~ .scene { --h0: #b58ba8; --h1: #cfaec6; --h2: #e8d3e2; --h3: #f5e6ee; }
  #t-night:checked  ~ #s-winter:checked ~ .scene { --h0: #3a4166; --h1: #4d5480; --h2: #6a729c; --h3: #8891b5; }

  /* ============================================================
     4. 날씨
     ============================================================ */
  #w-rain:checked ~ .scene { --weather-tint: rgba(88,98,124,.32); }
  #w-snow:checked ~ .scene { --weather-tint: rgba(178,186,204,.26); }
  #w-rain:checked ~ .scene #rain { display: inline; }
  #w-snow:checked ~ .scene #snow { display: inline; }
  #w-rain:checked ~ .scene #sun,  #w-snow:checked ~ .scene #sun,
  #w-rain:checked ~ .scene #moon, #w-snow:checked ~ .scene #moon,
  #w-rain:checked ~ .scene #stars,#w-snow:checked ~ .scene #stars { display: none; }

  /* ============================================================
     5. 소품 토글
     ============================================================ */
  #p-fire:not(:checked)   ~ .scene #fire        { display: none; }
  #p-candle:not(:checked) ~ .scene #candle      { display: none; }
  #p-orb:not(:checked)    ~ .scene #orb         { display: none; }
  #p-rug:not(:checked)    ~ .scene #rug         { display: none; }
  #p-plant:not(:checked)  ~ .scene #sill-plant  { display: none; }
  #p-props:not(:checked)  ~ .scene #floor-props { display: none; }
  #p-tree:not(:checked)   ~ .scene #leaves,
  #p-tree:not(:checked)   ~ .scene #tree-bare   { display: none; }
  #b1:not(:checked) ~ .scene #bk-1 { display: none; }
  #b2:not(:checked) ~ .scene #bk-2 { display: none; }
  #b3:not(:checked) ~ .scene #bk-3 { display: none; }
  #b4:not(:checked) ~ .scene #bk-4 { display: none; }
  #b5:not(:checked) ~ .scene #bk-5 { display: none; }
  #b6:not(:checked) ~ .scene #bk-6 { display: none; }

  /* ============================================================
     6. 애니메이션
     ============================================================ */
  .f-out, .f-mid, .f-core, .c-flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .f-out  { animation: flick-soft 0.9s ease-in-out infinite; }
  .f-mid  { animation: flick-soft 0.7s ease-in-out -0.3s infinite; }
  .f-core { animation: flick-core 0.5s ease-in-out infinite; }
  .c-flame { animation: candle-flick 1.7s ease-in-out infinite; }
  .twinkle-a { animation: twinkle 2.4s ease-in-out infinite; }
  .twinkle-b { animation: twinkle 3.1s ease-in-out -1.2s infinite; }
  .rain-fall   { animation: fall-30 0.7s steps(15) infinite; }
  .snow-fall-a { animation: fall-30 3.8s steps(30) infinite; }
  .snow-fall-b { animation: fall-30 5.4s steps(30) -2.1s infinite; }

  @keyframes flick-soft   { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.93); } }
  @keyframes flick-core   { 0%,100% { transform: scaleY(1); opacity: 1; } 50% { transform: scaleY(.84); opacity: .85; } }
  @keyframes candle-flick { 0%,100% { transform: scaleY(1); opacity: 1; } 42% { transform: scaleY(.78); opacity: .8; } 70% { transform: scaleY(.92); } }
  @keyframes twinkle      { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes fall-30      { to { transform: translateY(30px); } }

  @media (prefers-reduced-motion: reduce) {
    .scene svg * { animation: none !important; }
  }

  /* ============================================================
     7. 컨트롤 패널
     ============================================================ */
  .panel {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .g-label {
    width: 56px;
    flex: none;
    color: #8d7a92;
    font-size: 12px;
    letter-spacing: .04em;
  }
  .panel label {
    padding: 6px 14px;
    border-radius: 999px;
    background: #2a1c31;
    border: 1px solid #443150;
    color: #af9cb4;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: background .2s, color .2s, border-color .2s;
  }
  .panel label:hover { border-color: #6b5175; }
  .panel label.sm { padding: 6px 10px; font-size: 12px; }
  .divider { height: 1px; background: #2e2036; margin: 3px 0; }

  #t-day:checked    ~ .panel label[for="t-day"],
  #t-sunset:checked ~ .panel label[for="t-sunset"],
  #t-night:checked  ~ .panel label[for="t-night"],
  #s-spring:checked ~ .panel label[for="s-spring"],
  #s-summer:checked ~ .panel label[for="s-summer"],
  #s-autumn:checked ~ .panel label[for="s-autumn"],
  #s-winter:checked ~ .panel label[for="s-winter"],
  #w-clear:checked  ~ .panel label[for="w-clear"],
  #w-rain:checked   ~ .panel label[for="w-rain"],
  #w-snow:checked   ~ .panel label[for="w-snow"],
  #p-fire:checked   ~ .panel label[for="p-fire"],
  #p-candle:checked ~ .panel label[for="p-candle"],
  #p-orb:checked    ~ .panel label[for="p-orb"],
  #p-rug:checked    ~ .panel label[for="p-rug"],
  #p-plant:checked  ~ .panel label[for="p-plant"],
  #p-props:checked  ~ .panel label[for="p-props"],
  #p-tree:checked   ~ .panel label[for="p-tree"],
  #b1:checked ~ .panel label[for="b1"],
  #b2:checked ~ .panel label[for="b2"],
  #b3:checked ~ .panel label[for="b3"],
  #b4:checked ~ .panel label[for="b4"],
  #b5:checked ~ .panel label[for="b5"],
  #b6:checked ~ .panel label[for="b6"] {
    background: #d98e4a;
    border-color: #d98e4a;
    color: #2a1626;
    font-weight: 600;
  }
</style>
</head>
<body>

  <input class="ctl" type="radio" name="time" id="t-day">
  <input class="ctl" type="radio" name="time" id="t-sunset" checked>
  <input class="ctl" type="radio" name="time" id="t-night">
  <input class="ctl" type="radio" name="season" id="s-spring">
  <input class="ctl" type="radio" name="season" id="s-summer" checked>
  <input class="ctl" type="radio" name="season" id="s-autumn">
  <input class="ctl" type="radio" name="season" id="s-winter">
  <input class="ctl" type="radio" name="weather" id="w-clear" checked>
  <input class="ctl" type="radio" name="weather" id="w-rain">
  <input class="ctl" type="radio" name="weather" id="w-snow">
  <input class="ctl" type="checkbox" id="p-fire" checked>
  <input class="ctl" type="checkbox" id="p-candle" checked>
  <input class="ctl" type="checkbox" id="p-orb" checked>
  <input class="ctl" type="checkbox" id="p-rug" checked>
  <input class="ctl" type="checkbox" id="p-plant" checked>
  <input class="ctl" type="checkbox" id="p-props" checked>
  <input class="ctl" type="checkbox" id="p-tree" checked>
  <input class="ctl" type="checkbox" id="b1" checked>
  <input class="ctl" type="checkbox" id="b2" checked>
  <input class="ctl" type="checkbox" id="b3" checked>
  <input class="ctl" type="checkbox" id="b4" checked>
  <input class="ctl" type="checkbox" id="b5" checked>
  <input class="ctl" type="checkbox" id="b6" checked>

  <div class="scene">
    <svg viewBox="0 0 96 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="레퍼런스 픽셀아트를 재현한 거실 씬. 시간대·계절·날씨에 따라 변하며 벽난로와 책장, 창턱 위 돌멩이가 있다.">
<!--__ART__-->
    </svg>
  </div>

  <div class="panel">
    <div class="group">
      <span class="g-label">시간대</span>
      <label for="t-day">낮</label>
      <label for="t-sunset">노을</label>
      <label for="t-night">밤</label>
    </div>
    <div class="group">
      <span class="g-label">계절</span>
      <label for="s-spring">봄</label>
      <label for="s-summer">여름</label>
      <label for="s-autumn">가을</label>
      <label for="s-winter">겨울</label>
    </div>
    <div class="group">
      <span class="g-label">날씨</span>
      <label for="w-clear">맑음</label>
      <label for="w-rain">비</label>
      <label for="w-snow">눈</label>
    </div>
    <div class="divider"></div>
    <div class="group">
      <span class="g-label">소품</span>
      <label for="p-fire">벽난로 불</label>
      <label for="p-candle">촛불</label>
      <label for="p-orb">돌멩이</label>
      <label for="p-rug">러그</label>
      <label for="p-plant">화분</label>
      <label for="p-props">바닥 소품</label>
      <label for="p-tree">창밖 나무</label>
    </div>
    <div class="group">
      <span class="g-label">책장 책</span>
      <label class="sm" for="b1">1</label>
      <label class="sm" for="b2">2</label>
      <label class="sm" for="b3">3</label>
      <label class="sm" for="b4">4</label>
      <label class="sm" for="b5">5</label>
      <label class="sm" for="b6">6</label>
    </div>
  </div>

</body>
</html>
