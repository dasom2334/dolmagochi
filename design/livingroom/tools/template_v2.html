<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거실 씬 v2 — 중립 베이스 + 물리 광원 + 레이어 인스펙터</title>
<style>
  /* ============================================================
     v2: 중립 방(AO만) + 3계층 합성
       1) 시간 색감 오버레이  2) 날씨 색감 오버레이  3) 광원(개별 SVG)
     모든 SVG 그룹 개별 on/off 가능
     ============================================================ */
  .scene {
    --page-bg: #241627;
/*__BASE__*/
    /* 하늘(시간): 기본=낮 */
    --k0: #4a90c8; --k1: #62a5d6; --k2: #7ab5e0; --k3: #93c6ea;
    --k4: #aed6f0; --k5: #c8e4f6; --k6: #ddeefa;
    --sun0: #ffdf8f; --sun1: #fff6d8;
    /* 풍경(계절): 기본=여름 (중립 주광색) */
    --h0: #4c8544; --h1: #63a058; --h2: #84bc74; --h3: #b8d898;
    --t0: #3f5c30; --t1: #567a3c; --t2: #6f8a44;
    --t3: #7a5238; --t4: #8a6242;
    --moon:    #e9e6da;
    --moon-cr: #c8c3b2;
    --star:    #e8ecff;
    --rain:    #c9d4ea;
    --snow-p:  #f4f6fb;
    --cloud-1: #9aa4b5;
    --cloud-2: #7e8899;
    /* 바닥(무광원 중립 판자) */
    --fb0: #4a3542; --fb1: #58424f; --fb2: #634b59;
    --fbl: #392933; --fbh: #775c71; --fbk: #2b1e27;
    /* 돌(무광원 중립 그레이: 위=열린 하늘 AO 밝음, 아래=접지 AO) */
    --o0: #35333c; --o1: #4e4d54; --o2: #64655f; --o3: #797b6f; --o4: #8b8e7e;
    /* 광원: 창문(태양) / 창문(달) / 벽난로 / 촛불 / 스탠드 */
    --wl: #fff0c8; --wl-a: .20;
    --ml: #a8bcf0; --ml-a: .16;
    --fl: #ffa04a; --fl-a: .10;
    --cl: #ffcf8a; --cl-a: .08;
    --ll: #ffd9a0; --ll-a: .10;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #1b1020;
    padding: 24px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }

  .scene {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 4 / 3;
    background: var(--page-bg);
    border-radius: 12px;
    overflow: hidden;
    transition: background .6s;
  }

  .scene svg {
    display: block;
    width: 100%;
    height: 100%;
    shape-rendering: crispEdges;
  }

  .scene svg * { transition: fill .6s, opacity .6s; }

  .scene #moon, .scene #stars,
  .scene #rain, .scene #snow,
  .scene #clouds, .scene #tree-bare,
  .scene #fx-drops, .scene #fx-frost, .scene #fx-snowcap,
  .scene #pt-leaves, .scene #pt-petals, .scene #pt-fireflies,
  .scene #light-day, .scene #light-sunset, .scene #light-night,
  .scene #light-cloud, .scene #light-rain, .scene #light-snow,
  .scene #lp-sun-day, .scene #lp-moon { display: none; }

  .ctl {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ===== 계절 풍경 ===== */
  #s-spring:checked ~ .scene {
    --h0: #55804a; --h1: #6f9c5e; --h2: #8fba7c; --h3: #c2dfa6;
    --t0: #a86a8c; --t1: #d095b5; --t2: #e8b8ce;
  }
  #s-autumn:checked ~ .scene {
    --h0: #7a4a2e; --h1: #9a6538; --h2: #c08850; --h3: #e0b070;
    --t0: #7a3a28; --t1: #b0622e; --t2: #d08a3a;
  }
  #s-winter:checked ~ .scene {
    --h0: #8f9ab0; --h1: #b5c0d0; --h2: #d8e0ec; --h3: #eef2f8;
  }
  #s-winter:checked ~ .scene #leaves    { display: none; }
  #s-winter:checked ~ .scene #tree-bare { display: inline; }

  /* ===== 시간: 하늘 교체 + 광원 값 ===== */
  #t-sunset:checked ~ .scene {
    --k0: #39203e; --k1: #562b3c; --k2: #ae653e; --k3: #a5456a;
    --k4: #d55850; --k5: #f57639; --k6: #fc9840;
    --sun0: #fca951; --sun1: #fcce8b;
    --wl: #ff9a4a; --wl-a: .30; --fl-a: .16; --cl-a: .12; --ll-a: .15;
  }
  #t-night:checked ~ .scene {
    --k0: #0e1430; --k1: #131a3a; --k2: #1a2348; --k3: #232e56;
    --k4: #2c3862; --k5: #364471; --k6: #41507e;
    --page-bg: #150e1d;
    --fl-a: .30; --cl-a: .18; --ll-a: .28;
  }
  #t-night:checked ~ .scene #sun   { display: none; }
  #t-night:checked ~ .scene #moon  { display: inline; }
  #t-night:checked ~ .scene #stars { display: inline; }

  /* 창문 광원의 시간 게이팅: 태양광은 낮·노을, 달빛은 밤 */
  #t-day:checked   ~ .scene #lp-sun-day { display: inline; }
  #t-day:checked   ~ .scene #lp-sun-low { display: none; }
  #t-night:checked ~ .scene #lp-sun     { display: none; }
  #t-night:checked ~ .scene #lp-moon    { display: inline; }

  /* 노을 언덕: 원경은 노을빛 머금은 자주·핑크 (겨울은 장밋빛 눈으로 유지) */
  #t-sunset:checked ~ .scene { --h0: #3f2946; --h1: #5a3760; --h2: #7d4a70; --h3: #a45f80; }
  #t-sunset:checked ~ #s-winter:checked ~ .scene { --h0: #8a7a96; --h1: #ab9ab2; --h2: #cdbccd; --h3: #e8d8e0; }

  /* 밤 언덕 실루엣 (겨울 눈빛 유지) */
  #t-night:checked ~ .scene { --h0: #12172f; --h1: #1a2140; --h2: #242c52; --h3: #303a64; }
  #t-night:checked ~ #s-winter:checked ~ .scene { --h0: #3a4166; --h1: #4d5480; --h2: #6a729c; --h3: #8891b5; }

  /* 밤 나무: 달빛에 가라앉은 톤 (계절 컴파운드) */
  #t-night:checked ~ .scene { --t0: #1f2b1c; --t1: #2c3d26; --t2: #3a4e30; --t3: #3a2f33; --t4: #463a3c; }
  #t-night:checked ~ #s-spring:checked ~ .scene { --t0: #4a3350; --t1: #5f4468; --t2: #75587c; }
  #t-night:checked ~ #s-autumn:checked ~ .scene { --t0: #3d2620; --t1: #54321e; --t2: #6b4426; }

  /* 계절이 광원에 관여하는 예: 겨울 낮의 창문 빛은 차가운 흰색 */
  #t-day:checked ~ #s-winter:checked ~ .scene { --wl: #eef4fc; --wl-a: .24; }

  /* ===== 날씨: 구름·파티클·광원 감쇠 ===== */
  #w-cloud:checked ~ .scene { --wl: #c8d2e0; --wl-a: .10; --ml-a: .06; }
  #w-rain:checked  ~ .scene { --wl: #93a4bc; --wl-a: .07; --ml-a: .04; }
  #w-snow:checked  ~ .scene { --wl: #dde8f6; --wl-a: .16; --ml-a: .10; }
  #w-cloud:checked ~ .scene #clouds,
  #w-rain:checked  ~ .scene #clouds,
  #w-snow:checked  ~ .scene #clouds { display: inline; }
  #w-rain:checked ~ .scene #rain { display: inline; }
  #w-snow:checked ~ .scene #snow { display: inline; }
  #w-cloud:checked ~ .scene #sun,  #w-rain:checked ~ .scene #sun,  #w-snow:checked ~ .scene #sun,
  #w-cloud:checked ~ .scene #moon, #w-rain:checked ~ .scene #moon, #w-snow:checked ~ .scene #moon,
  #w-cloud:checked ~ .scene #stars,#w-rain:checked ~ .scene #stars,#w-snow:checked ~ .scene #stars { display: none; }

  /* ===== 색감 오버레이 표시 (시간/날씨 분리) ===== */
  #t-day:checked    ~ .scene #light-day    { display: inline; }
  #t-sunset:checked ~ .scene #light-sunset { display: inline; }
  #t-night:checked  ~ .scene #light-night  { display: inline; }
  #w-cloud:checked  ~ .scene #light-cloud  { display: inline; }
  #w-rain:checked   ~ .scene #light-rain   { display: inline; }
  #w-snow:checked   ~ .scene #light-snow   { display: inline; }

  /* ===== 창문 효과 ===== */
  #w-rain:checked   ~ .scene #fx-drops   { display: inline; }
  #s-winter:checked ~ .scene #fx-frost   { display: inline; }
  #w-snow:checked   ~ .scene #fx-snowcap { display: inline; }

  /* ===== 돌 위치: 창턱(원근 축소판) / 러그(방 한가운데 원래 크기) ===== */
  #op-sill:checked ~ .scene #orb-rug   { display: none; }
  #op-sill:checked ~ .scene .occ-orb2  { display: none; }
  #op-rug:checked  ~ .scene #orb       { display: none; }
  #op-rug:checked  ~ .scene .occ-orb   { display: none; }

  /* ===== 계절 파티클 ===== */
  #s-autumn:checked ~ #w-clear:checked ~ .scene #pt-leaves { display: inline; }
  #s-autumn:checked ~ #w-cloud:checked ~ .scene #pt-leaves { display: inline; }
  #s-spring:checked ~ #w-clear:checked ~ .scene #pt-petals { display: inline; }
  #s-spring:checked ~ #w-cloud:checked ~ .scene #pt-petals { display: inline; }
  #t-night:checked ~ #s-summer:checked ~ #w-clear:checked ~ .scene #pt-fireflies { display: inline; }

  /* ============================================================
     레이어 인스펙터 — 모든 그룹 개별 on/off (마스터는 !important)
     ============================================================ */
  #ov-time:not(:checked)    ~ .scene #light-day,
  #ov-time:not(:checked)    ~ .scene #light-sunset,
  #ov-time:not(:checked)    ~ .scene #light-night  { display: none !important; }
  #ov-weather:not(:checked) ~ .scene #light-cloud,
  #ov-weather:not(:checked) ~ .scene #light-rain,
  #ov-weather:not(:checked) ~ .scene #light-snow   { display: none !important; }

  #p-lsun:not(:checked)    ~ .scene #lp-sun    { display: none !important; }
  #p-lmoon:not(:checked)   ~ .scene #lp-moon   { display: none !important; }
  #p-lfire:not(:checked)   ~ .scene #lp-fire   { display: none !important; }
  #p-lcandle:not(:checked) ~ .scene #lp-candle { display: none !important; }
  #p-llamp:not(:checked)   ~ .scene #lp-lamp   { display: none !important; }

  #L-wall:not(:checked)      ~ .scene #g-wall        { display: none !important; }
  #L-floor:not(:checked)     ~ .scene #g-floor       { display: none !important; }
  #L-winframe:not(:checked)  ~ .scene #g-winframe    { display: none !important; }
  #L-fireplace:not(:checked) ~ .scene #g-fireplace   { display: none !important; }
  #L-shelf:not(:checked)     ~ .scene #g-shelf       { display: none !important; }
  #L-scenery:not(:checked)   ~ .scene #base-scenery  { display: none !important; }
  #L-tree:not(:checked)      ~ .scene #leaves,
  #L-tree:not(:checked)      ~ .scene #tree-trunk,
  #L-tree:not(:checked)      ~ .scene #tree-bare     { display: none !important; }
  #L-sun:not(:checked)       ~ .scene #sun           { display: none !important; }
  #L-moon:not(:checked)      ~ .scene #moon          { display: none !important; }
  #L-stars:not(:checked)     ~ .scene #stars         { display: none !important; }
  #L-clouds:not(:checked)    ~ .scene #clouds        { display: none !important; }
  #L-rug:not(:checked)       ~ .scene #rug           { display: none !important; }
  #L-orb:not(:checked)       ~ .scene #orb,
  #L-orb:not(:checked)       ~ .scene #orb-rug       { display: none !important; }
  #L-plant:not(:checked)     ~ .scene #sill-plant    { display: none !important; }
  #L-props:not(:checked)     ~ .scene #floor-props   { display: none !important; }
  #L-candle:not(:checked)    ~ .scene #candle        { display: none !important; }
  #L-fire:not(:checked)      ~ .scene #fire          { display: none !important; }
  #L-lamp:not(:checked)      ~ .scene #lamp          { display: none !important; }
  #L-candle:not(:checked)    ~ .scene #candle-flame  { display: none !important; }
  #L-lamp:not(:checked)      ~ .scene #lamp-glow     { display: none !important; }
  #p-llamp:not(:checked)     ~ .scene #lamp-glow     { display: none !important; }
  #L-books:not(:checked)     ~ .scene #bk-1, #L-books:not(:checked) ~ .scene #bk-2,
  #L-books:not(:checked)     ~ .scene #bk-3, #L-books:not(:checked) ~ .scene #bk-4,
  #L-books:not(:checked)     ~ .scene #bk-5, #L-books:not(:checked) ~ .scene #bk-6 { display: none !important; }
  /* 소품 OFF → 해당 오클루더(광원 마스크 속 그림자)도 OFF */
  #L-orb:not(:checked)   ~ .scene .occ-orb,
  #L-orb:not(:checked)   ~ .scene .occ-orb2  { display: none; }
  #L-plant:not(:checked) ~ .scene .occ-plant { display: none; }
  #L-props:not(:checked) ~ .scene .occ-props { display: none; }

  #p-fx:not(:checked) ~ .scene #rain, #p-fx:not(:checked) ~ .scene #snow,
  #p-fx:not(:checked) ~ .scene #pt-leaves, #p-fx:not(:checked) ~ .scene #pt-petals,
  #p-fx:not(:checked) ~ .scene #pt-fireflies, #p-fx:not(:checked) ~ .scene #fx-drops,
  #p-fx:not(:checked) ~ .scene #fx-frost, #p-fx:not(:checked) ~ .scene #fx-snowcap { display: none !important; }

  /* ===== 애니메이션 ===== */
  .f-out, .f-mid, .f-core, .c-flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .f-out  { animation: flick-soft 0.9s ease-in-out infinite; }
  .f-mid  { animation: flick-soft 0.7s ease-in-out -0.3s infinite; }
  .f-core { animation: flick-core 0.5s ease-in-out infinite; }
  .c-flame { animation: candle-flick 1.7s ease-in-out infinite; }
  .twinkle-a { animation: twinkle 2.4s ease-in-out infinite; }
  .twinkle-b { animation: twinkle 3.1s ease-in-out -1.2s infinite; }
  .rain-fall   { animation: fall-30 0.7s steps(15) infinite; }
  .snow-fall-a { animation: fall-30 3.8s steps(30) infinite; }
  .snow-fall-b { animation: fall-30 5.4s steps(30) -2.1s infinite; }
  .drift-a     { animation: fall-30 6.5s steps(30) infinite; }
  .drift-b     { animation: fall-30 8s   steps(30) -3.5s infinite; }
  .firefly-a   { animation: twinkle 1.8s ease-in-out infinite; }
  .firefly-b   { animation: twinkle 2.6s ease-in-out -0.9s infinite; }
  .cloud-drift { animation: cloud-move 34s linear infinite alternate; }
  .glow-flicker      { animation: glow-breathe 1.3s ease-in-out infinite; }
  .glow-flicker-slow { animation: glow-breathe 2.2s ease-in-out -0.8s infinite; }

  @keyframes flick-soft   { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.93); } }
  @keyframes flick-core   { 0%,100% { transform: scaleY(1); opacity: 1; } 50% { transform: scaleY(.84); opacity: .85; } }
  @keyframes candle-flick { 0%,100% { transform: scaleY(1); opacity: 1; } 42% { transform: scaleY(.78); opacity: .8; } 70% { transform: scaleY(.92); } }
  @keyframes twinkle      { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes fall-30      { to { transform: translateY(30px); } }
  @keyframes cloud-move   { from { transform: translateX(-2px); } to { transform: translateX(3px); } }
  @keyframes glow-breathe { 0%,100% { opacity: 1; } 50% { opacity: .72; } }

  @media (prefers-reduced-motion: reduce) {
    .scene svg * { animation: none !important; }
  }

  /* ===== 패널 ===== */
  .panel {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .g-label { width: 56px; flex: none; color: #8d7a92; font-size: 12px; letter-spacing: .04em; }
  .panel label {
    padding: 5px 12px;
    border-radius: 999px;
    background: #2a1c31;
    border: 1px solid #443150;
    color: #af9cb4;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: background .2s, color .2s, border-color .2s;
  }
  .panel label:hover { border-color: #6b5175; }
  .divider { height: 1px; background: #2e2036; margin: 2px 0; }
  .note { color: #6f5e76; font-size: 11px; }

  #t-day:checked      ~ .panel label[for="t-day"],
  #t-sunset:checked   ~ .panel label[for="t-sunset"],
  #t-night:checked    ~ .panel label[for="t-night"],
  #s-spring:checked   ~ .panel label[for="s-spring"],
  #s-summer:checked   ~ .panel label[for="s-summer"],
  #s-autumn:checked   ~ .panel label[for="s-autumn"],
  #s-winter:checked   ~ .panel label[for="s-winter"],
  #w-clear:checked    ~ .panel label[for="w-clear"],
  #w-cloud:checked    ~ .panel label[for="w-cloud"],
  #w-rain:checked     ~ .panel label[for="w-rain"],
  #w-snow:checked     ~ .panel label[for="w-snow"],
  #op-sill:checked    ~ .panel label[for="op-sill"],
  #op-rug:checked     ~ .panel label[for="op-rug"],
  #ov-time:checked    ~ .panel label[for="ov-time"],
  #ov-weather:checked ~ .panel label[for="ov-weather"],
  #p-lsun:checked     ~ .panel label[for="p-lsun"],
  #p-lmoon:checked    ~ .panel label[for="p-lmoon"],
  #p-lfire:checked    ~ .panel label[for="p-lfire"],
  #p-lcandle:checked  ~ .panel label[for="p-lcandle"],
  #p-llamp:checked    ~ .panel label[for="p-llamp"],
  #L-wall:checked      ~ .panel label[for="L-wall"],
  #L-floor:checked     ~ .panel label[for="L-floor"],
  #L-winframe:checked  ~ .panel label[for="L-winframe"],
  #L-fireplace:checked ~ .panel label[for="L-fireplace"],
  #L-shelf:checked     ~ .panel label[for="L-shelf"],
  #L-scenery:checked   ~ .panel label[for="L-scenery"],
  #L-tree:checked      ~ .panel label[for="L-tree"],
  #L-sun:checked       ~ .panel label[for="L-sun"],
  #L-moon:checked      ~ .panel label[for="L-moon"],
  #L-stars:checked     ~ .panel label[for="L-stars"],
  #L-clouds:checked    ~ .panel label[for="L-clouds"],
  #L-rug:checked       ~ .panel label[for="L-rug"],
  #L-orb:checked       ~ .panel label[for="L-orb"],
  #L-plant:checked     ~ .panel label[for="L-plant"],
  #L-props:checked     ~ .panel label[for="L-props"],
  #L-candle:checked    ~ .panel label[for="L-candle"],
  #L-fire:checked      ~ .panel label[for="L-fire"],
  #L-books:checked     ~ .panel label[for="L-books"],
  #L-lamp:checked      ~ .panel label[for="L-lamp"],
  #p-fx:checked        ~ .panel label[for="p-fx"] {
    background: #d98e4a;
    border-color: #d98e4a;
    color: #2a1626;
    font-weight: 600;
  }
</style>
</head>
<body>

  <input class="ctl" type="radio" name="time" id="t-day" checked>
  <input class="ctl" type="radio" name="time" id="t-sunset">
  <input class="ctl" type="radio" name="time" id="t-night">
  <input class="ctl" type="radio" name="season" id="s-spring">
  <input class="ctl" type="radio" name="season" id="s-summer" checked>
  <input class="ctl" type="radio" name="season" id="s-autumn">
  <input class="ctl" type="radio" name="season" id="s-winter">
  <input class="ctl" type="radio" name="weather" id="w-clear" checked>
  <input class="ctl" type="radio" name="weather" id="w-cloud">
  <input class="ctl" type="radio" name="weather" id="w-rain">
  <input class="ctl" type="radio" name="weather" id="w-snow">
  <input class="ctl" type="radio" name="orbpos" id="op-sill" checked>
  <input class="ctl" type="radio" name="orbpos" id="op-rug">
  <input class="ctl" type="checkbox" id="ov-time" checked>
  <input class="ctl" type="checkbox" id="ov-weather" checked>
  <input class="ctl" type="checkbox" id="p-lsun" checked>
  <input class="ctl" type="checkbox" id="p-lmoon" checked>
  <input class="ctl" type="checkbox" id="p-lfire" checked>
  <input class="ctl" type="checkbox" id="p-lcandle" checked>
  <input class="ctl" type="checkbox" id="p-llamp" checked>
  <input class="ctl" type="checkbox" id="L-wall" checked>
  <input class="ctl" type="checkbox" id="L-floor" checked>
  <input class="ctl" type="checkbox" id="L-winframe" checked>
  <input class="ctl" type="checkbox" id="L-fireplace" checked>
