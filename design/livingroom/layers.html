<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거실 씬 — 레이어 조합 실험 (29 에셋 → 48 조합)</title>
<style>
  /* ============================================================
     레이어 아키텍처 실험
     방(고정 중립 팔레트) + 계절 풍경 + 시간 하늘 + 날씨 오버레이
     + 조명 오버레이(시간3+날씨3 스태킹) + 창문 효과 + 파티클
     ============================================================ */
  .scene {
    --page-bg: #241627;
    --o0: #513e5d;
    --o1: #6c4d6f;
    --o2: #7c6b8d;
    --o3: #a093a6;
    --o4: #c1b2c1;
    --o5: #f3c2ab;
    --o6: #dacdcf;
    --rg0: #7d4565;
    --rg1: #8d4869;
    --rg2: #a04d67;
    --rg3: #af5462;
    --rg4: #bc6a65;
    --f0: #b1472f;
    --f1: #df5924;
    --f2: #f9972f;
    --f3: #fcc875;
    --cd0: #905c70;
    --cd1: #f0d1b8;
    --cd2: #f6e0c6;
    --pl0: #747356;
    --pl1: #ad7553;
    --pl2: #d9896c;
    --pp0: #754b45;
    --pp1: #ac5759;
    --pp2: #ca7d7d;
    --pp3: #dc8b79;
    --pp4: #f1b67c;
    --b1x0: #8f6763;
    --b1x1: #ca7a76;
    --b2x0: #837d62;
    --b2x1: #ce966e;
    --b3x0: #705f96;
    --b3x1: #cd967e;
    --b4x0: #65466d;
    --b4x1: #7e5280;
    --b5x0: #635f6e;
    --b5x1: #6a7677;
    --b6x0: #5f426a;
    --b6x1: #60436a;
    --s0: #483756;
    --s1: #503a5b;
    --s2: #5a3e63;
    --s3: #654057;
    --s4: #644162;
    --s5: #70435e;
    --s6: #87494e;
    --s7: #714969;
    --s8: #82475b;
    --s9: #974e57;
    --s10: #834e6b;
    --s11: #737656;
    --s12: #a85552;
    --s13: #868055;
    --s14: #a15669;
    --s15: #b96153;
    --s16: #ab6366;
    --s17: #b66a71;
    --s18: #b27f6f;
    --s19: #c37974;
    --s20: #d58167;
    --s21: #9f7b92;
    --s22: #c68d73;
    --s23: #e38c6a;
    --s24: #e18c89;
    --s25: #db9d73;
    /* 하늘(시간): 기본=낮 */
    --k0: #4a90c8; --k1: #62a5d6; --k2: #7ab5e0; --k3: #93c6ea;
    --k4: #aed6f0; --k5: #c8e4f6; --k6: #ddeefa;
    --sun0: #ffdf8f; --sun1: #fff6d8;
    /* 풍경(계절): 기본=여름 (중립 주광색) */
    --h0: #4c8544; --h1: #63a058; --h2: #84bc74; --h3: #b8d898;
    --t0: #3f5c30; --t1: #567a3c; --t2: #6f8a44;
    --t3: #7a5238; --t4: #8a6242;
    --moon:    #e9e6da;
    --moon-cr: #c8c3b2;
    --star:    #e8ecff;
    --rain:    #c9d4ea;
    --snow-p:  #f4f6fb;
    --cloud-1: #9aa4b5;
    --cloud-2: #7e8899;
    /* 광원: 창문 빛 / 벽난로 빛 / 촛불 빛 (색, 세기) */
    --wl: #fff0c8; --wl-a: .20;
    --fl: #ffa04a; --fl-a: .10;
    --cl: #ffcf8a; --cl-a: .08;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #1b1020;
    padding: 24px 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }

  .scene {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 4 / 3;
    background: var(--page-bg);
    border-radius: 12px;
    overflow: hidden;
    transition: background .6s;
  }

  .scene svg {
    display: block;
    width: 100%;
    height: 100%;
    shape-rendering: crispEdges;
  }

  .scene svg * { transition: fill .6s, opacity .6s; }

  .scene #moon, .scene #stars,
  .scene #rain, .scene #snow,
  .scene #clouds, .scene #tree-bare,
  .scene #fx-drops, .scene #fx-frost, .scene #fx-snowcap,
  .scene #pt-leaves, .scene #pt-petals, .scene #pt-fireflies,
  .scene #light-day, .scene #light-sunset, .scene #light-night,
  .scene #light-cloud, .scene #light-rain, .scene #light-snow { display: none; }

  .ctl {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* ===== 계절 풍경 (에셋 4) ===== */
  #s-spring:checked ~ .scene {
    --h0: #55804a; --h1: #6f9c5e; --h2: #8fba7c; --h3: #c2dfa6;
    --t0: #a86a8c; --t1: #d095b5; --t2: #e8b8ce;
  }
  #s-autumn:checked ~ .scene {
    --h0: #7a4a2e; --h1: #9a6538; --h2: #c08850; --h3: #e0b070;
    --t0: #7a3a28; --t1: #b0622e; --t2: #d08a3a;
  }
  #s-winter:checked ~ .scene {
    --h0: #8f9ab0; --h1: #b5c0d0; --h2: #d8e0ec; --h3: #eef2f8;
  }
  #s-winter:checked ~ .scene #leaves    { display: none; }
  #s-winter:checked ~ .scene #tree-bare { display: inline; }

  /* ===== 하늘 (에셋 3) — 시간은 하늘만 바꾼다. 방은 조명 오버레이가 담당 ===== */
  #t-sunset:checked ~ .scene {
    --k0: #39203e; --k1: #562b3c; --k2: #ae653e; --k3: #a5456a;
    --k4: #d55850; --k5: #f57639; --k6: #fc9840;
    --sun0: #fca951; --sun1: #fcce8b;
    --wl: #ff9a4a; --wl-a: .30; --fl-a: .16; --cl-a: .12;
  }
  #t-night:checked ~ .scene {
    --k0: #0e1430; --k1: #131a3a; --k2: #1a2348; --k3: #232e56;
    --k4: #2c3862; --k5: #364471; --k6: #41507e;
    --page-bg: #150e1d;
    --wl: #a8bcf0; --wl-a: .16; --fl-a: .30; --cl-a: .18;
  }
  #t-night:checked ~ .scene #sun   { display: none; }
  #t-night:checked ~ .scene #moon  { display: inline; }
  #t-night:checked ~ .scene #stars { display: inline; }

  /* 밤 실루엣 언덕만 예외적으로 시간이 관여 (겨울 눈빛 유지) */
  #t-night:checked ~ .scene { --h0: #12172f; --h1: #1a2140; --h2: #242c52; --h3: #303a64; }
  #t-night:checked ~ #s-winter:checked ~ .scene { --h0: #3a4166; --h1: #4d5480; --h2: #6a729c; --h3: #8891b5; }

  /* 계절이 광원에 관여하는 예: 겨울 낮의 창문 빛은 차가운 흰색 */
  #t-day:checked ~ #s-winter:checked ~ .scene { --wl: #eef4fc; --wl-a: .24; }

  /* ===== 날씨 오버레이 (에셋 4: 맑음=없음, 구름은 흐림·비·눈 공용) ===== */
  #w-cloud:checked ~ .scene { --wl: #c8d2e0; --wl-a: .10; }
  #w-rain:checked  ~ .scene { --wl: #93a4bc; --wl-a: .07; }
  #w-snow:checked  ~ .scene { --wl: #dde8f6; --wl-a: .16; }
  #w-cloud:checked ~ .scene #clouds,
  #w-rain:checked  ~ .scene #clouds,
  #w-snow:checked  ~ .scene #clouds { display: inline; }
  #w-rain:checked ~ .scene #rain { display: inline; }
  #w-snow:checked ~ .scene #snow { display: inline; }
  #w-cloud:checked ~ .scene #sun,  #w-rain:checked ~ .scene #sun,  #w-snow:checked ~ .scene #sun,
  #w-cloud:checked ~ .scene #moon, #w-rain:checked ~ .scene #moon, #w-snow:checked ~ .scene #moon,
  #w-cloud:checked ~ .scene #stars,#w-rain:checked ~ .scene #stars,#w-snow:checked ~ .scene #stars { display: none; }

  /* ===== 조명 오버레이 (에셋 6) — 시간 조명 + 날씨 조명 스태킹 ===== */
  #p-light:checked ~ #t-day:checked    ~ .scene #light-day    { display: inline; }
  #p-light:checked ~ #t-sunset:checked ~ .scene #light-sunset { display: inline; }
  #p-light:checked ~ #t-night:checked  ~ .scene #light-night  { display: inline; }
  #p-light:checked ~ #w-cloud:checked  ~ .scene #light-cloud  { display: inline; }
  #p-light:checked ~ #w-rain:checked   ~ .scene #light-rain   { display: inline; }
  #p-light:checked ~ #w-snow:checked   ~ .scene #light-snow   { display: inline; }

  /* ===== 광원 토글 ===== */
  #p-lwin:not(:checked)    ~ .scene #lp-window { display: none; }
  #p-lfire:not(:checked)   ~ .scene #lp-fire   { display: none; }
  #p-lcandle:not(:checked) ~ .scene #lp-candle { display: none; }

  /* ===== 창문 효과 (에셋 3) ===== */
  #w-rain:checked   ~ .scene #fx-drops   { display: inline; }
  #s-winter:checked ~ .scene #fx-frost   { display: inline; }
  #w-snow:checked   ~ .scene #fx-snowcap { display: inline; }

  /* ===== 파티클 (에셋 5: 비·눈 + 낙엽·꽃잎·반딧불) ===== */
  #s-autumn:checked ~ #w-clear:checked ~ .scene #pt-leaves { display: inline; }
  #s-autumn:checked ~ #w-cloud:checked ~ .scene #pt-leaves { display: inline; }
  #s-spring:checked ~ #w-clear:checked ~ .scene #pt-petals { display: inline; }
  #s-spring:checked ~ #w-cloud:checked ~ .scene #pt-petals { display: inline; }
  #t-night:checked ~ #s-summer:checked ~ #w-clear:checked ~ .scene #pt-fireflies { display: inline; }

  /* ===== 애니메이션 ===== */
  .f-out, .f-mid, .f-core, .c-flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .f-out  { animation: flick-soft 0.9s ease-in-out infinite; }
  .f-mid  { animation: flick-soft 0.7s ease-in-out -0.3s infinite; }
  .f-core { animation: flick-core 0.5s ease-in-out infinite; }
  .c-flame { animation: candle-flick 1.7s ease-in-out infinite; }
  .twinkle-a { animation: twinkle 2.4s ease-in-out infinite; }
  .twinkle-b { animation: twinkle 3.1s ease-in-out -1.2s infinite; }
  .rain-fall   { animation: fall-30 0.7s steps(15) infinite; }
  .snow-fall-a { animation: fall-30 3.8s steps(30) infinite; }
  .snow-fall-b { animation: fall-30 5.4s steps(30) -2.1s infinite; }
  .drift-a     { animation: fall-30 6.5s steps(30) infinite; }
  .drift-b     { animation: fall-30 8s   steps(30) -3.5s infinite; }
  .firefly-a   { animation: twinkle 1.8s ease-in-out infinite; }
  .firefly-b   { animation: twinkle 2.6s ease-in-out -0.9s infinite; }
  .cloud-drift { animation: cloud-move 34s linear infinite alternate; }
  .glow-flicker      { animation: glow-breathe 1.3s ease-in-out infinite; }
  .glow-flicker-slow { animation: glow-breathe 2.2s ease-in-out -0.8s infinite; }

  @keyframes flick-soft   { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.93); } }
  @keyframes flick-core   { 0%,100% { transform: scaleY(1); opacity: 1; } 50% { transform: scaleY(.84); opacity: .85; } }
  @keyframes candle-flick { 0%,100% { transform: scaleY(1); opacity: 1; } 42% { transform: scaleY(.78); opacity: .8; } 70% { transform: scaleY(.92); } }
  @keyframes twinkle      { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes fall-30      { to { transform: translateY(30px); } }
  @keyframes sway         { 0%,100% { margin-left: 0; } 50% { margin-left: 2px; } }
  @keyframes cloud-move   { from { transform: translateX(-2px); } to { transform: translateX(3px); } }
  @keyframes glow-breathe { 0%,100% { opacity: 1; } 50% { opacity: .72; } }

  @media (prefers-reduced-motion: reduce) {
    .scene svg * { animation: none !important; }
  }

  /* ===== 컨트롤 패널 ===== */
  .panel {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .g-label { width: 56px; flex: none; color: #8d7a92; font-size: 12px; letter-spacing: .04em; }
  .panel label {
    padding: 6px 14px;
    border-radius: 999px;
    background: #2a1c31;
    border: 1px solid #443150;
    color: #af9cb4;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    user-select: none;
    transition: background .2s, color .2s, border-color .2s;
  }
  .panel label:hover { border-color: #6b5175; }
  .divider { height: 1px; background: #2e2036; margin: 3px 0; }
  .note { color: #6f5e76; font-size: 11px; }

  #t-day:checked    ~ .panel label[for="t-day"],
  #t-sunset:checked ~ .panel label[for="t-sunset"],
  #t-night:checked  ~ .panel label[for="t-night"],
  #s-spring:checked ~ .panel label[for="s-spring"],
  #s-summer:checked ~ .panel label[for="s-summer"],
  #s-autumn:checked ~ .panel label[for="s-autumn"],
  #s-winter:checked ~ .panel label[for="s-winter"],
  #w-clear:checked  ~ .panel label[for="w-clear"],
  #w-cloud:checked  ~ .panel label[for="w-cloud"],
  #w-rain:checked   ~ .panel label[for="w-rain"],
  #w-snow:checked   ~ .panel label[for="w-snow"],
  #p-light:checked  ~ .panel label[for="p-light"],
  #p-lwin:checked    ~ .panel label[for="p-lwin"],
  #p-lfire:checked   ~ .panel label[for="p-lfire"],
  #p-lcandle:checked ~ .panel label[for="p-lcandle"] {
    background: #d98e4a;
    border-color: #d98e4a;
    color: #2a1626;
    font-weight: 600;
  }
</style>
</head>
<body>

  <input class="ctl" type="checkbox" id="p-light" checked>
  <input class="ctl" type="checkbox" id="p-lwin" checked>
  <input class="ctl" type="checkbox" id="p-lfire" checked>
  <input class="ctl" type="checkbox" id="p-lcandle" checked>
  <input class="ctl" type="radio" name="time" id="t-day" checked>
  <input class="ctl" type="radio" name="time" id="t-sunset">
  <input class="ctl" type="radio" name="time" id="t-night">
  <input class="ctl" type="radio" name="season" id="s-spring">
  <input class="ctl" type="radio" name="season" id="s-summer" checked>
  <input class="ctl" type="radio" name="season" id="s-autumn">
  <input class="ctl" type="radio" name="season" id="s-winter">
  <input class="ctl" type="radio" name="weather" id="w-clear" checked>
  <input class="ctl" type="radio" name="weather" id="w-cloud">
  <input class="ctl" type="radio" name="weather" id="w-rain">
  <input class="ctl" type="radio" name="weather" id="w-snow">

  <div class="scene">
    <svg viewBox="0 0 96 72" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="레이어 조합 방식 실험: 고정된 방 위에 계절 풍경, 시간 하늘, 날씨, 조명 오버레이를 겹쳐 48가지 환경을 만든다.">
