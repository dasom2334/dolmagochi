<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>씬 v4 — 거실/침실 통합 뷰어</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; background:#1b1020; padding:24px 12px;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif; }
  #stage { width:100%; max-width:900px; aspect-ratio:16/9; border-radius:12px;
           overflow:hidden; background:#241627; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  .panel { width:100%; max-width:900px; display:flex; flex-direction:column; gap:8px; }
  .group { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .g-label { width:56px; flex:none; color:#8d7a92; font-size:12px; letter-spacing:.04em; }
  label { padding:5px 12px; border-radius:999px; background:#2a1c31; border:1px solid #443150;
          color:#af9cb4; font-size:12px; line-height:1; cursor:pointer; user-select:none;
          transition:background .15s,color .15s,border-color .15s; }
  label:hover { border-color:#6b5175; }
  label.on { background:#d98e4a; border-color:#d98e4a; color:#2a1626; font-weight:600; }
  label.room { padding:6px 16px; font-size:13px; }
  .divider { height:1px; background:#2e2036; margin:2px 0; }
  .note { color:#6f5e76; font-size:11px; }
  .slide { display:flex; align-items:center; gap:8px; }
  .slide > span:first-child { width:74px; flex:none; color:#af9cb4; font-size:12px; }
  .slide input { flex:1; max-width:260px; accent-color:#d98e4a; }
  .slide > span:last-child { width:38px; flex:none; color:#8d7a92; font-size:11px;
                             font-variant-numeric:tabular-nums; text-align:right; }
  .sw { display:flex; align-items:center; gap:4px; color:#af9cb4; font-size:11px; }
  .sw input[type=color] { width:22px; height:22px; padding:0; border:1px solid #443150;
                          border-radius:4px; background:none; cursor:pointer; }
  #editHead { display:flex; align-items:center; gap:8px; color:#d98e4a; font-size:12px;
              letter-spacing:.04em; margin-bottom:2px; }
  #editHead button { padding:3px 10px; border-radius:999px; background:#2a1c31;
                     border:1px solid #443150; color:#af9cb4; font-size:11px; cursor:pointer; }
  #editOut { width:100%; max-width:560px; height:64px; margin-top:4px; display:none;
             background:#140c1a; border:1px solid #443150; border-radius:6px; color:#c9b6cf;
             font:11px ui-monospace,monospace; padding:6px; resize:vertical; }
</style>
</head>
<body>
  <div id="stage"><canvas id="cv" width="128" height="72"></canvas></div>
  <div class="panel">
    <div class="group" id="roomRow"></div>
    <div class="divider"></div>
    <div id="editWrap"><div id="editBox"></div><div class="divider"></div></div>
    <div id="ambBox"></div>
    <div class="divider"></div>
    <div id="roomPanel"></div>
    <div class="note" id="note"></div>
  </div>

  <script type="module">
    import { render as renderLiving, SHOP_PROPS as LIVING_SHOP } from '../livingroom/scene/render.js';
    import { render as renderBedroom, SHOP_PROPS as BD_SHOP } from './render.js';
    import { render as renderKitchen, SHOP_PROPS as KT_SHOP,
             ROOM_PROPS as KT_ROOM } from '../cookingroom/render.js';
    import { render as renderWalk } from '../walk/scene.js';
    import { reduceMotion } from '../livingroom/scene/anim.js';
    import { AMBIENT } from '../livingroom/scene/lights.js';
    import { resolve } from '../livingroom/scene/palette.js';
    import { ROOM_DATA } from '../livingroom/scene/room-data.js';
    import { BD_ART } from './geom-art.js';
    import { emitRows } from '../livingroom/scene/generate.js';

    const cv = document.getElementById('cv');

    // ── 픽셀 드로잉 (Phase 3) — rect 레이어를 셀맵으로 편집 ──
    // 레이어 선택 시 BD_ART[id] 를 셀맵(state.paintCells)으로 펼쳐 편집, render 가 이걸 그린다.
    const PAINT_LAYERS = [['bd-wall', '벽'], ['bd-frames', '액자'], ['bd-shelf', '선반'],
      ['bd-bed', '침대'], ['bd-fan', '선풍기'], ['bd-nightstand', '협탁'], ['bd-desk', '책상'],
      ['bd-laptop', '노트북'], ['bd-deskplant', '카페인'], ['bd-chair', '의자']];
    let drawTool = 'pencil', drawColor = '#c8a060', drawColorInput = null;

    function enterPaint(id) {
      off.delete(id);                             // 편집하려면 켜져 있어야 보인다
      state.paintLayer = id;
      state.paintCells = new Map();
      for (const [x, y, w, h, color] of (BD_ART[id] || []))
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
          state.paintCells.set((x + i) + ',' + (y + j), color);
      draw();
    }
    function exportLayer() {
      if (!state.paintCells) return '(레이어 없음)';
      const cells = [];
      for (const [k, hex] of state.paintCells) { const c = k.indexOf(','); cells.push([+k.slice(c + 1), +k.slice(0, c), hex]); }
      return '"' + state.paintLayer + '": ' + JSON.stringify(emitRows(cells));
    }
    function paintAt(e) {
      if (!state.paintLayer || !state.paintCells) return;
      const r = cv.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / r.width * 128);
      const y = Math.floor((e.clientY - r.top) / r.height * 72);
      if (x < 0 || x >= 128 || y < 0 || y >= 72) return;
      const key = x + ',' + y, cells = state.paintCells;
      if (drawTool === 'eraser') cells.delete(key);
      else if (drawTool === 'eyedrop') {
        const p = cv.getContext('2d').getImageData(x, y, 1, 1).data;
        drawColor = '#' + [p[0], p[1], p[2]].map((n) => n.toString(16).padStart(2, '0')).join('');
        if (drawColorInput) drawColorInput.value = drawColor;
      } else cells.set(key, drawColor);
      draw();
    }
    let painting = false;
    cv.addEventListener('pointerdown', (e) => { if (!state.paintLayer) return; painting = true; try { cv.setPointerCapture(e.pointerId); } catch (_) { } paintAt(e); });
    cv.addEventListener('pointermove', (e) => { if (painting) paintAt(e); });
    cv.addEventListener('pointerup', () => { painting = false; });
    cv.addEventListener('pointerleave', () => { painting = false; });

    // 주방 레이어 한글 이름 — 상품 11종(게임 shop.json)과 방 구조 5종.
    // 방 구조는 **상품이 아니다**(확정) — 거실 벽난로·침실 책상과 달리 대응 상품이 없다.
    const KT_NAME = {
      'kt-pot':'냄비', 'kt-broom':'빗자루', 'kt-shoes':'신발', 'kt-umbrella':'우산',
      'kt-lunchbox':'피크닉가방', 'kt-teaset':'찻상', 'kt-board':'도마', 'kt-ladle':'국자',
      'kt-ingredients':'요리재료', 'kt-brush':'솔', 'kt-cleaner':'세척도구',
      'kt-door':'문', 'kt-shelf':'곁선반', 'kt-rack':'걸이선반', 'kt-table':'작업대', 'kt-sink':'싱크대',
    };
    const ktList = (ids) => ids.map((id) => [id, KT_NAME[id] || id.slice(3)]);

    // ── 방별 설정 (거실 축·토글은 v3.html 에서 그대로 가져옴) ──
    // 순서는 게임 rooms.json 과 같다: 주방 → 거실 → 침실.
    const ROOMS = {
      kitchen: {
        name: '주방', render: renderKitchen,
        state: () => ({ time:'day', season:'summer', weather:'clear', orb:'floor', sprout:'none', wither:0,
                        stove:'on', variant:'b' }),
        off: () => new Set(),                   // 아트 검수용 — 가득 찬 방으로 시작
        axes: [
          ['시안','variant',[['b','B 손작화'],['a','A 추출'],['c','C 손보정']]],
          ['시간','time',[['day','낮'],['sunset','노을'],['night','밤']]],
          ['계절','season',[['spring','봄'],['summer','여름'],['autumn','가을'],['winter','겨울']]],
          ['날씨','weather',[['clear','맑음'],['cloud','구름흐림'],['fog','안개흐림'],
                            ['rain','비'],['downpour','폭우'],['snow','눈'],['petals','꽃잎·낙엽']]],
          ['돌','orb',[['none','없음'],['floor','바닥'],['sink','싱크대'],['door','문 앞']]],
          ['새싹','sprout',[['none','없음'],['budding','전조'],['thriving','무성'],
            ['rooting1','뿌리내림'],['rooting2','뒤덮임']]],
          ['시듦','wither',[[0,'0'],[1,'1'],[2,'2'],[3,'3']]],
          ['화구','stove',[['on','켬'],['off','끔']]],
        ],
        toggles: [
          ['색감',[['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                  ['light-cloud','구름흐림'],['light-fog','안개흐림'],['light-rain','비'],
                  ['light-downpour','폭우'],['light-snow','눈'],['light-petals','꽃잎·낙엽']]],
          ['광원',[['lp-sun','창문 햇빛'],['lp-moon','창문 달빛'],['stove-glow','화구'],
                  ['rim','역광'],['shadow','접지그림자'],['vignette','비네트']]],
          ['배경',[['g-wall','벽/창틀'],['g-floor','바닥']]],
          ['창밖',[['base-scenery','풍경'],['sun','해'],['moon','달'],['stars','별'],['clouds','구름']]],
          ['상품', ktList(KT_SHOP).concat([['orb','돌']])],
          ['방구조', ktList(KT_ROOM)],
          ['효과',[['anim','애니메이션']]],
        ],
      },
      living: {
        name: '거실', render: renderLiving,
        state: () => ({ time:'sunset', season:'summer', weather:'clear', orb:'sill', sprout:'none', wither:0, tree:'v1', ptree:'none',
                        window:'closed', cup:'empty', readBook:1 }),
        off: () => new Set(LIVING_SHOP),
        axes: [
          ['시간','time',[['day','낮'],['sunset','노을'],['night','밤']]],
          ['계절','season',[['spring','봄'],['summer','여름'],['autumn','가을'],['winter','겨울']]],
          ['날씨','weather',[['clear','맑음'],['cloud','구름흐림'],['fog','안개흐림'],
                            ['rain','비'],['downpour','폭우'],['snow','눈'],['petals','꽃잎·낙엽']]],
          ['돌','orb',[['sill','창턱'],['rug','러그']]],
          ['새싹','sprout',[['none','없음'],['budding','전조'],['thriving','무성'],
            ['rooting1','뿌리내림'],['rooting2','뒤덮임']]],
          ['시듦','wither',[[0,'0'],[1,'1'],[2,'2'],[3,'3']]],
          ['나무','tree',[['v1','v1 침엽'],['v2','v2 활엽']]],
          ['심은나무','ptree',[['none','안 심음'],[0,'0 개화'],[1,'1 열매'],[2,'2 각성기'],
            [3,'3 무성'],[4,'4 울창'],[5,'5 성목']]],
          ['창문','window',[['closed','닫힘'],['open','열림']]],
          ['찻잔','cup',[['empty','빈 잔'],['full','채움·김']]],
          ['읽는책','readBook',[[0,'없음'],[1,'1권'],[2,'2권'],[3,'3권'],[4,'4권'],[5,'5권'],[6,'6권']]],
        ],
        toggles: [
          ['색감',[['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                  ['light-cloud','구름흐림'],['light-fog','안개흐림'],['light-rain','비'],
                  ['light-downpour','폭우'],['light-snow','눈'],['light-petals','꽃잎·낙엽']]],
          ['광원',[['lp-sun','창문 햇빛'],['lp-moon','창문 달빛'],['lp-fire','벽난로'],
                  ['lp-lamp','스탠드'],['rim','역광'],['shadow','그림자·비네트']]],
          ['배경',[['g-wall','벽'],['sill-shelf','창턱선반'],['g-floor','바닥'],['g-winframe','창틀'],
                  ['g-fireplace','벽난로'],['g-shelf','책장']]],
          ['창밖',[['base-scenery','풍경'],['tree-v1','나무v1'],['tree-v2','나무v2'],
                  ['sun','해'],['moon','달'],['stars','별'],['clouds','구름']]],
          ['소품',[['rug','러그'],['orb','창턱 돌'],['orb-rug','러그 돌'],['sill-plant','화분'],
                  ['fire','불꽃'],['lamp','스탠드']]],
          ['상점',[['p-cushion','돌 방석'],['p-cup','찻잔'],['p-windchime','풍경']]],
          ['사물',[['p-blanket','담요'],['p-waterglass','물컵'],['p-bird','창턱 새'],['rug-mark','돌 자국']]],
          ['효과',[['anim','애니메이션']]],
        ],
      },
      bedroom: {
        name: '침실', render: renderBedroom,
        state: () => ({ time:'day', season:'summer', weather:'clear', orb:'chair', sprout:'none', wither:0, lamp:'off',
                        variant:'v3', drink:'coffee', window:'closed' }),
        off: () => new Set(),                   // 아트 검수용 — 가득 찬 방으로 시작
        axes: [
          ['버전','variant',[['current','현재'],['v3','v3 손작화'],['prev','이전']]],
          ['시간','time',[['day','낮'],['sunset','노을'],['night','밤']]],
          ['계절','season',[['spring','봄'],['summer','여름'],['autumn','가을'],['winter','겨울']]],
          ['날씨','weather',[['clear','맑음'],['cloud','구름흐림'],['fog','안개흐림'],
                            ['rain','비'],['downpour','폭우'],['snow','눈'],['petals','꽃잎·낙엽']]],
          ['돌','orb',[['none','없음'],['chair','의자(작업)'],['bed','침대'],['rug','러그']]],
          ['새싹','sprout',[['none','없음'],['budding','전조'],['thriving','무성'],
            ['rooting1','뿌리내림'],['rooting2','뒤덮임']]],
          ['시듦','wither',[[0,'0'],[1,'1'],[2,'2'],[3,'3']]],
          ['스탠드','lamp',[['off','끔'],['on','켬']]],
          ['카페인','drink',[['coffee','커피'],['iced','아아'],['redbull','레드불']]],
          ['창문','window',[['closed','닫힘'],['open','열림']]],
        ],
        toggles: [
          ['색감',[['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                  ['light-cloud','구름흐림'],['light-fog','안개흐림'],['light-rain','비'],
                  ['light-downpour','폭우'],['light-snow','눈'],['light-petals','꽃잎·낙엽']]],
          ['광원',[['lp-sun','창문 햇빛'],['lp-moon','창문 달빛'],['lamp-glow','스탠드'],
                  ['screen-glow','모니터'],['rim','역광'],['shadow','접지그림자'],['vignette','비네트']]],
          ['배경',[['g-wall','벽/창틀'],['g-floor','바닥']]],
          ['창밖',[['base-scenery','풍경'],['sun','해'],['moon','달'],['stars','별'],['clouds','구름']]],
          ['소품',[['bd-desk','책상'],['bd-chair','의자'],['bd-laptop','노트북'],['bd-deskplant','카페인'],
                  ['bd-lamp','스탠드'],['bd-nightstand','협탁'],['bd-bed','침대'],['bd-pillow','베개'],['bd-fan','선풍기'],
                  ['bd-rug','러그'],['bd-shelf','선반'],['bd-frames','액자'],['orb','돌']]],
          ['효과',[['anim','애니메이션']]],
        ],
      },
      walk: {
        name: '산책', render: renderWalk,
        state: () => ({ scene:'ridge', time:'day', season:'summer', weather:'clear',
                        orb:'path', umbrella:'off', sprout:'none', wither:0 }),
        off: () => new Set(),
        axes: [
          ['장소','scene',[['ridge','언덕 오르막'],['riverside','개울 나무다리'],['homeward','노을 귀갓길']]],
          ['시간','time',[['day','낮'],['sunset','노을'],['night','밤']]],
          ['계절','season',[['spring','봄'],['summer','여름'],['autumn','가을'],['winter','겨울']]],
          ['날씨','weather',[['clear','맑음'],['cloud','구름흐림'],['fog','안개흐림'],
                            ['rain','비'],['downpour','폭우'],['snow','눈'],['petals','꽃잎·낙엽']]],
          ['돌','orb',[['none','없음'],['path','길 위']]],
          ['우산','umbrella',[['off','안 씀'],['on','씀']]],
          ['새싹','sprout',[['none','없음'],['budding','전조'],['thriving','무성'],
            ['rooting1','뿌리내림'],['rooting2','뒤덮임']]],
          ['시듦','wither',[[0,'0'],[1,'1'],[2,'2'],[3,'3']]],
        ],
        toggles: [
          ['색감',[['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                  ['light-cloud','구름흐림'],['light-fog','안개흐림'],['light-rain','비'],
                  ['light-downpour','폭우'],['light-snow','눈'],['light-petals','꽃잎·낙엽']]],
          ['광원',[['rim','역광'],['vignette','비네트'],['window-glow','창불'],['fireflies','반딧불']]],
          ['배경',[['sun','해'],['moon','달'],['stars','별'],['clouds','구름']]],
          ['효과',[['anim','애니메이션'],['orb','돌'],['sprout','새싹']]],
        ],
      },
    };

    let roomKey = 'living';
    let state = ROOMS[roomKey].state();
    let off = ROOMS[roomKey].off();
    let pills = [];
    let editInputs = [];
    let posTarget = 'bd-bed';

    // ── 앰비언트 (방과 무관하게 공유) — 패널 맨 위 ──
    const ambBox = document.getElementById('ambBox');
    const AMB_TARGETS = [['light-day','낮'],['light-sunset','노을'],['light-night','밤'],
                         ['light-cloud','구름흐림'],['light-fog','안개흐림'],['light-rain','비'],
                         ['light-downpour','폭우'],['light-snow','눈'],['light-petals','꽃잎·낙엽']];
    let ambTarget = 'light-day';
    const ambPills = [];
    const ambRow = document.createElement('div'); ambRow.className = 'group';
    const ambLab = document.createElement('span'); ambLab.className = 'g-label'; ambLab.textContent = '앰비언트';
    ambRow.append(ambLab);
    for (const [oid, txt] of AMB_TARGETS) {
      const b = document.createElement('label'); b.textContent = txt;
      b.onclick = () => { ambTarget = oid; syncAmb(); redraw(); };
      ambPills.push([b, () => ambTarget === oid]); ambRow.append(b);
    }
    ambBox.append(ambRow);
    const ambName = document.createElement('div'); ambName.className = 'note'; ambBox.append(ambName);
    const AMB = [['screen','screen'],['overlay','overlay'],['saturation','세츄레이션']];
    const ambInputs = [];
    for (const [key, txt] of AMB) {
      const row = document.createElement('div'); row.className = 'slide';
      const name = document.createElement('span'); name.textContent = txt;
      const inp = document.createElement('input');
      inp.type='range'; inp.min=0; inp.max=0.6; inp.step=0.01;
      const val = document.createElement('span');
      inp.oninput = () => { AMBIENT[ambTarget][key]=+inp.value; val.textContent=(+inp.value).toFixed(2); redraw(); };
      row.append(name, inp, val); ambBox.append(row);
      ambInputs.push([key, inp, val]);
    }
    function syncAmb() {
      const txt = AMB_TARGETS.find(([o]) => o === ambTarget)[1];
      const dim = off.has(ambTarget) ? ' — 지금 꺼져 있어 화면에 안 보인다' : '';
      ambName.textContent = `조정 대상: ${txt} (${ambTarget})${dim}`;
      for (const [key, inp, val] of ambInputs) {
        inp.value = AMBIENT[ambTarget][key]; val.textContent = AMBIENT[ambTarget][key].toFixed(2);
      }
    }

    // ── 방 스위처 ──
    const roomRow = document.getElementById('roomRow');
    const roomLab = document.createElement('span'); roomLab.className = 'g-label'; roomLab.textContent = '방';
    roomRow.append(roomLab);
    const roomPills = [];
    for (const key of Object.keys(ROOMS)) {
      const b = document.createElement('label'); b.className = 'room'; b.textContent = ROOMS[key].name;
      b.onclick = () => switchRoom(key);
      roomPills.push([b, () => roomKey === key]); roomRow.append(b);
    }

    // ── 방별 축·토글 패널 (전환 시 재생성) ──
    const roomPanel = document.getElementById('roomPanel');
    function buildPanel() {
      roomPanel.innerHTML = ''; pills = [];
      const cfg = ROOMS[roomKey];
      const mk = (labelText, items, isAxis, key) => {
        const row = document.createElement('div'); row.className = 'group';
        const l = document.createElement('span'); l.className = 'g-label'; l.textContent = labelText;
        row.append(l);
        for (const [val, txt] of items) {
          const b = document.createElement('label'); b.textContent = txt;
          b.onclick = () => { if (isAxis) state[key]=val; else (off.has(val)?off.delete(val):off.add(val)); redraw(); };
          pills.push([b, isAxis ? () => state[key]===val : () => !off.has(val)]);
          row.append(b);
        }
        roomPanel.append(row);
      };
      for (const [t, key, items] of cfg.axes) mk(t, items, true, key);
      const div = document.createElement('div'); div.className='divider'; roomPanel.append(div);
      for (const [t, items] of cfg.toggles) mk(t, items, false);
    }

    // ── 편집 패널 (Phase 1: 색·빛 강도) — 침실 전용. state.override/vigK/shadowK 를 바꾼다 ──
    const editBox = document.getElementById('editBox');
    // 방 스위처 옆 '편집' 토글로 접기/펴기. 기본 접힘.
    const editWrap = document.getElementById('editWrap');
    editWrap.style.display = 'none';
    const editToggle = document.createElement('label');
    editToggle.className = 'room'; editToggle.textContent = '편집 ▸'; editToggle.style.marginLeft = '12px';
    editToggle.onclick = () => {
      const open = editWrap.style.display === 'none';
      editWrap.style.display = open ? '' : 'none';
      editToggle.classList.toggle('on', open);
      editToggle.textContent = open ? '편집 ▾' : '편집 ▸';
    };
    document.getElementById('roomRow').append(editToggle);
    const EDIT_COLORS = [
      ['하늘', [['--k1', '상단'], ['--k9', '지평선']]],
      ['산',   [['--h0', '먼 산'], ['--h2', '앞 산']]],
      ['바닥', [['--fb0', '판자a'], ['--fb1', '판자b'], ['--fb2', '판자c'], ['--fbk', '줄눈']]],
      ['러그', [['--rg0', '외곽'], ['--rg2', '필드'], ['--rg4', '테두리']]],
      ['돌',   [['--o0', '아래'], ['--o2', '중간'], ['--o4', '위']]],
      ['빛',   [['--wl', '햇빛색'], ['--ml', '달빛색']]],
    ];
    // [라벨, 키, min, max, step, 종류] — override=팔레트 슬롯(--wl-a 등), state=배율(그림자/비네트)
    const EDIT_SLIDERS = [
      ['창광(햇빛)', '--wl-a', 0, 1, 0.02, 'override'],
      ['창광(달빛)', '--ml-a', 0, 1, 0.02, 'override'],
      ['그림자',    'shadowK', 0, 2, 0.05, 'state'],
      ['비네트',    'vigK',    0, 2, 0.05, 'state'],
    ];
    const hex6 = (c) => (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) ? c : '#000000';
    // Phase 2 위치·크기 대상 (가구 = offset dx/dy, 러그 = cx/dy/폭)
    const POS_FURN = [['bd-bed', '침대'], ['bd-desk', '책상'], ['bd-chair', '의자'],
      ['bd-nightstand', '협탁'], ['bd-fan', '선풍기'], ['bd-frames', '액자'],
      ['bd-shelf', '선반'], ['bd-laptop', '노트북'], ['bd-deskplant', '카페인']];

    function buildEdit() {
      editBox.innerHTML = ''; editInputs = [];
      if (roomKey !== 'bedroom') return;         // 침실 render 만 override 를 읽는다
      const def = resolve(state, ROOM_DATA.palette);

      const head = document.createElement('div'); head.id = 'editHead';
      head.append(document.createTextNode('편집 (화면에서만 임시 적용)'));
      const bReset = document.createElement('button'); bReset.textContent = '초기화';
      bReset.onclick = () => { delete state.override; delete state.vigK; delete state.shadowK; delete state.offset; delete state.rug; delete state.paintLayer; delete state.paintCells; buildEdit(); draw(); };
      const bCopy = document.createElement('button'); bCopy.textContent = '값 복사';
      const out = document.createElement('textarea'); out.id = 'editOut'; out.readOnly = true;
      bCopy.onclick = () => {
        const o = { ...(state.override || {}) };
        if (state.shadowK != null) o.shadowK = state.shadowK;
        if (state.vigK != null) o.vigK = state.vigK;
        if (state.rug && Object.keys(state.rug).length) o.rug = state.rug;
        if (state.offset && Object.keys(state.offset).length) {
          const nz = Object.fromEntries(Object.entries(state.offset).filter(([, v]) => v[0] || v[1]));
          if (Object.keys(nz).length) o.offset = nz;
        }
        out.value = Object.keys(o).length ? JSON.stringify(o, null, 2) : '(바꾼 값 없음)';
        out.style.display = 'block';
        navigator.clipboard?.writeText(out.value);
      };
      head.append(bReset, bCopy);
      editBox.append(head);

      const mkRow = (label) => {
        const row = document.createElement('div'); row.className = 'group';
        const l = document.createElement('span'); l.className = 'g-label'; l.textContent = label;
        row.append(l); editBox.append(row); return row;
      };
      for (const [g, items] of EDIT_COLORS) {
        const row = mkRow(g);
        for (const [slot, label] of items) {
          const wrap = document.createElement('label'); wrap.className = 'sw';
          const inp = document.createElement('input'); inp.type = 'color';
          inp.value = hex6(state.override?.[slot] ?? def[slot]);
          inp.oninput = () => { (state.override || (state.override = {}))[slot] = inp.value; draw(); };
          const s = document.createElement('span'); s.textContent = label;
          wrap.append(inp, s); row.append(wrap);
          editInputs.push([slot, inp]);
        }
      }
      for (const [label, key, min, max, step, kind] of EDIT_SLIDERS) {
        const row = document.createElement('div'); row.className = 'slide';
        const name = document.createElement('span'); name.textContent = label;
        const inp = document.createElement('input'); inp.type = 'range';
        inp.min = min; inp.max = max; inp.step = step;
        const cur = kind === 'override' ? parseFloat(state.override?.[key] ?? def[key] ?? 0) : (state[key] ?? 1);
        inp.value = cur;
        const val = document.createElement('span'); val.textContent = (+cur).toFixed(2);
        inp.oninput = () => {
          const v = +inp.value; val.textContent = v.toFixed(2);
          if (kind === 'override') (state.override || (state.override = {}))[key] = v;
          else state[key] = v;
          draw();
        };
        row.append(name, inp, val); editBox.append(row);
      }

      // ── 위치·크기 (Phase 2) — 대상 고르고 슬라이더로 이동/크기 ──
      const posRow = mkRow('위치·크기');
      const posPills = [];
      for (const [id, label] of [...POS_FURN, ['rug', '러그']]) {
        const b = document.createElement('label'); b.textContent = label;
        b.onclick = () => { posTarget = id; buildPos(); posPills.forEach(([el, f]) => el.classList.toggle('on', f())); };
        posPills.push([b, () => posTarget === id]); posRow.append(b);
      }
      posPills.forEach(([el, f]) => el.classList.toggle('on', f()));
      const posBox = document.createElement('div'); editBox.append(posBox);
      const mkSlide = (label, min, max, step, cur, on) => {
        const row = document.createElement('div'); row.className = 'slide';
        const n = document.createElement('span'); n.textContent = label;
        const inp = document.createElement('input'); inp.type = 'range';
        inp.min = min; inp.max = max; inp.step = step; inp.value = cur;
        const v = document.createElement('span'); v.textContent = String(cur);
        inp.oninput = () => { const x = +inp.value; v.textContent = String(x); on(x); draw(); };
        row.append(n, inp, v); posBox.append(row);
      };
      function buildPos() {
        posBox.innerHTML = '';
        if (posTarget === 'rug') {
          const r = state.rug || (state.rug = {});
          mkSlide('좌우', 40, 92, 1, r.cx ?? 66, (x) => r.cx = x);
          mkSlide('앞뒤', -8, 8, 1, r.dy ?? 0, (x) => r.dy = x);
          mkSlide('뒤폭', 8, 42, 1, r.hwBack ?? 22, (x) => r.hwBack = x);
          mkSlide('앞폭', 12, 48, 1, r.hwFront ?? 32, (x) => r.hwFront = x);
        } else {
          const o = state.offset || (state.offset = {});
          const cur = o[posTarget] || [0, 0];
          mkSlide('좌우', -30, 30, 1, cur[0], (x) => (o[posTarget] || (o[posTarget] = [0, 0]))[0] = x);
          mkSlide('상하', -20, 20, 1, cur[1], (x) => (o[posTarget] || (o[posTarget] = [0, 0]))[1] = x);
        }
      }
      buildPos();

      // ── 그리기 (Phase 3) — rect 레이어 선택 후 캔버스에 픽셀 편집 ──
      const drawRow = mkRow('그리기');
      const drawPills = [];
      for (const [id, label] of PAINT_LAYERS) {
        const b = document.createElement('label'); b.textContent = label;
        b.onclick = () => { enterPaint(id); drawPills.forEach(([el, f]) => el.classList.toggle('on', f())); buildDrawTools(); };
        drawPills.push([b, () => state.paintLayer === id]); drawRow.append(b);
      }
      drawPills.forEach(([el, f]) => el.classList.toggle('on', f()));
      const drawTools = document.createElement('div'); editBox.append(drawTools);
      function buildDrawTools() {
        drawTools.innerHTML = '';
        if (!state.paintLayer) return;
        const row = document.createElement('div'); row.className = 'group';
        const l = document.createElement('span'); l.className = 'g-label'; l.textContent = '도구'; row.append(l);
        const toolPills = [];
        for (const [t, label] of [['pencil', '연필'], ['eraser', '지우개'], ['eyedrop', '스포이드']]) {
          const b = document.createElement('label'); b.textContent = label;
          b.onclick = () => { drawTool = t; toolPills.forEach(([el, tt]) => el.classList.toggle('on', tt === drawTool)); };
          toolPills.push([b, t]); row.append(b);
        }
        toolPills.forEach(([el, tt]) => el.classList.toggle('on', tt === drawTool));
        const cwrap = document.createElement('label'); cwrap.className = 'sw';
        const ci = document.createElement('input'); ci.type = 'color'; ci.value = drawColor;
        ci.oninput = () => { drawColor = ci.value; }; drawColorInput = ci;
        const cs = document.createElement('span'); cs.textContent = '색'; cwrap.append(ci, cs); row.append(cwrap);
        const bExit = document.createElement('label'); bExit.textContent = '나가기';
        bExit.onclick = () => { delete state.paintLayer; delete state.paintCells; buildEdit(); draw(); };
        const bExp = document.createElement('label'); bExp.textContent = '내보내기';
        bExp.onclick = () => { out.value = exportLayer(); out.style.display = 'block'; navigator.clipboard?.writeText(out.value); };
        row.append(bExit, bExp); drawTools.append(row);
      }
      buildDrawTools();

      editBox.append(out);
    }
    // 오버라이드 안 된 색 스와치는 시간/계절이 바뀌면 현재 실제색으로 갱신
    function syncEditSwatches() {
      if (roomKey !== 'bedroom' || !editInputs.length) return;
      const def = resolve(state, ROOM_DATA.palette);
      for (const [slot, inp] of editInputs)
        if (!(state.override && slot in state.override)) inp.value = hex6(def[slot]);
    }
    function redraw() { draw(); syncEditSwatches(); }

    function switchRoom(key) {
      roomKey = key;
      state = ROOMS[key].state();
      off = ROOMS[key].off();
      if (reduceMotion()) off.add('anim');
      buildPanel(); buildEdit(); syncAmb(); draw();
    }

    document.getElementById('note').textContent =
      '거실=런타임 생성, 침실=레퍼런스 추출. 렌더 패스·UI·오버레이·비네트·AMBIENT 공유. 벽을 끄면 창밖 풍경이 통째로 드러난다.';

    if (reduceMotion()) off.add('anim');
    buildPanel(); buildEdit(); syncAmb();

    let t0 = performance.now(), frozen = 0, paused = false;
    function draw(t = frozen) {
      ROOMS[roomKey].render(cv, state, off, t);
      for (const [el, isOn] of [...roomPills, ...ambPills, ...pills]) el.classList.toggle('on', isOn());
    }
    function loop(now) { if (!paused) { frozen = now - t0; draw(frozen); } requestAnimationFrame(loop); }
    draw(); requestAnimationFrame(loop);
    window.__scene = { get state(){return state;}, get off(){return off;}, draw,
                       room: switchRoom, pause: (v=true)=>{paused=v;} };
  </script>
</body>
</html>
