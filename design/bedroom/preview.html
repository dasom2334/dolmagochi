<!-- 침실 씬 — 레퍼런스(times/day.png) 128×72 추출 기준.
     벽·바닥·창틀·가구는 tools/extract.py 산출물(geom-art.js)을 그린다.
     창 유리 구멍엔 절차 하늘(거실 모듈), 그 위에 시간·날씨 오버레이·비네트.
     돌은 거실 생성 돌(ball/rim). -->
<!doctype html>
<meta charset="utf-8" />
<title>침실 씬 (레퍼런스 추출)</title>
<style>
  body { margin: 0; background: #15101c; color: #c9c0d4;
         font: 13px ui-monospace, monospace; display: flex; flex-direction: column;
         align-items: center; gap: 10px; padding: 16px; }
  canvas { image-rendering: pixelated; width: 640px; height: 360px; border: 2px solid #3a3350; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; max-width: 680px; }
  button { border: 2px solid #6b6178; background: transparent; color: #c9c0d4;
           font: inherit; padding: 4px 9px; cursor: pointer; border-radius: 3px; }
  button.on { border-color: #c9c0d4; color: #f2ead8; }
  span.lbl { align-self: center; color: #8a7f96; min-width: 44px; }
</style>
<canvas id="cv" width="128" height="72"></canvas>
<div class="row" id="time"></div>
<div class="row" id="season"></div>
<div class="row" id="weather"></div>
<div class="row" id="orb"></div>
<div class="row" id="layers"></div>
<div class="row" id="props"></div>

<script type="module">
import { generateGroups } from '../livingroom/scene/generate.js';
import { resolve } from '../livingroom/scene/palette.js';
import { OVERLAYS, AMBIENT, VIGNETTE } from '../livingroom/scene/lights.js';
import { BD_ART, BD_ART_Z, BD_ART_PROPS, BD_GLASS } from './geom-art.js';
import { ORB_SPOTS, lampArt, lampGlowArt } from './geom.js';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const groups = generateGroups({});           // 절차 하늘·산·달·구름·날씨

// 시간대별 오버레이 세기 배율 — 베이스가 **낮 추출**이라 낮은 약하게, 밤·노을은 강하게
const OVL_GAIN = { day: 0.35, sunset: 1, night: 1 };

const state = {
  time: 'day', season: 'summer', weather: 'clear',
  orb: 'chair', lamp: false, off: new Set(),
};

function slot(pal, v) { return v[0] === '#' ? v : (pal[v] || '#f0f'); }
function drawRects(rects, pal) {
  for (const r of rects) {
    ctx.globalAlpha = r[5] == null ? 1 : r[5];
    ctx.fillStyle = slot(pal, r[4]);
    ctx.fillRect(r[0], r[1], r[2], r[3]);
  }
  ctx.globalAlpha = 1;
}

function scaleAlpha(css, k) {
  const m = css.match(/rgba?\(([^)]+)\)/); if (!m) return css;
  const p = m[1].split(',').map((s) => s.trim());
  const a = p.length > 3 ? parseFloat(p[3]) : 1;
  return `rgba(${p[0]},${p[1]},${p[2]},${a * k})`;
}

// 유리 구멍(4판)으로 클립 → 절차 하늘
function clipGlass() {
  ctx.beginPath();
  for (const [x0, y0, x1, y1] of BD_GLASS) ctx.rect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  ctx.clip();
}
// 방 영역(유리 제외)으로 클립 — 오버레이가 하늘을 이중착색하지 않게
function clipRoom() {
  ctx.beginPath();
  ctx.rect(0, 0, 128, 72);
  for (const [x0, y0, x1, y1] of BD_GLASS) ctx.rect(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  ctx.clip('evenodd');
}

// 시간·날씨 오버레이 — 거실 OVERLAYS 를 zone 태그째. 낮은 OVL_GAIN 으로 약화.
function applyOverlay(oid, gain) {
  const list = OVERLAYS[oid]; if (!list) return;
  const seen = new Set();
  for (const { fill, blend, tune, zone } of list) {
    const key = `${zone}|${fill}|${blend}|${tune || ''}`;
    if (seen.has(key)) continue; seen.add(key);
    let s = (tune ? (AMBIENT[oid]?.[tune] ?? 0) : 1) * gain;
    if (s <= 0) continue;
    ctx.save();
    ctx.globalCompositeOperation = blend;
    ctx.fillStyle = s >= 1 ? fill : scaleAlpha(fill, s);
    if (zone === 'glass') { clipGlass(); ctx.fillRect(0, 0, 128, 72); }
    else { clipRoom(); ctx.fillRect(0, 0, 128, 72); }
    ctx.restore();
  }
}

function draw() {
  const pal = resolve(state);
  const off = state.off;
  ctx.clearRect(0, 0, 128, 72);
  ctx.fillStyle = pal['--page-bg'] || '#1a1330';
  ctx.fillRect(0, 0, 128, 72);
  // 1) 창밖 하늘 — 유리 구멍에만
  if (!off.has('bg')) {
    ctx.save(); clipGlass();
    drawRects(groups['base-scenery'], pal);
    for (const id of ['halo-moon', 'halo-sun', 'clouds']) if (groups[id]) drawRects(groups[id], pal);
    ctx.restore();
  }
  // 2) 벽·창틀(유리는 구멍) 3) 바닥
  if (!off.has('wall')) drawRects(BD_ART['bd-wall'], pal);
  if (!off.has('floor')) drawRects(BD_ART['bd-floor'], pal);
  // 4) 가구 (z-순서, 게이팅)
  for (const id of BD_ART_Z) {
    if (id === 'bd-wall' || id === 'bd-floor') continue;
    if (off.has(id)) continue;
    drawRects(BD_ART[id], pal);
  }
  // 4.5) 스탠드 (밤 작업 조명) — 추출본엔 없어 별도로 얹는다
  if (!off.has('bd-lamp')) drawRects(lampArt(), pal);
  // 5) 돌 — 거실 돌
  const orb = (state.orb !== 'none' && ORB_SPOTS[state.orb]) ? ORB_SPOTS[state.orb]() : null;
  if (orb) drawRects(orb.base, pal);
  // 6) 시간·날씨 색감 오버레이
  ctx.globalCompositeOperation = 'source-over';
  if (!off.has('overlay')) {
    applyOverlay(`light-${state.time}`, OVL_GAIN[state.time] ?? 1);
    applyOverlay(`light-${state.weather}`, 1);
  }
  // 6.5) 돌 역광
  if (orb) {
    const sunOn = state.time !== 'night';
    const rimPal = { ...pal, '--wl': sunOn ? pal['--wl'] : (pal['--ml'] || pal['--wl']) };
    ctx.globalCompositeOperation = 'screen';
    drawRects(orb.rim, rimPal);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 6.7) 스탠드 불빛(emission)
  if (state.lamp && !off.has('bd-lamp')) {
    ctx.globalCompositeOperation = 'lighter';
    drawRects(lampGlowArt(), pal);
    ctx.globalCompositeOperation = 'source-over';
  }
  // 7) 비네트
  if (!off.has('vignette')) {
    ctx.globalCompositeOperation = 'multiply';
    for (const v of VIGNETTE) { ctx.globalAlpha = v.alpha; ctx.fillStyle = v.fill; ctx.fillRect(...v.r); }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// ── 인스펙터 ──
function pick(elId, label, key, opts) {
  const el = document.getElementById(elId);
  el.innerHTML = `<span class="lbl">${label}</span>`;
  for (const o of opts) {
    const b = document.createElement('button');
    b.textContent = o; b.className = state[key] === o ? 'on' : '';
    b.onclick = () => { state[key] = o; refresh(); };
    el.appendChild(b);
  }
}
const SCENE_LAYERS = [['bg', '창밖배경'], ['wall', '벽/창틀'], ['floor', '바닥'],
  ['overlay', '색감'], ['vignette', '비네트']];
function multi(elId, label, items, getState, toggle) {
  const el = document.getElementById(elId);
  el.innerHTML = `<span class="lbl">${label}</span>`;
  for (const [id, name] of items) {
    const b = document.createElement('button');
    b.textContent = name; b.className = getState(id) ? 'on' : '';
    b.onclick = () => { toggle(id); refresh(); };
    el.appendChild(b);
  }
}
function refresh() {
  pick('time', 'time', 'time', ['day', 'sunset', 'night']);
  pick('season', 'season', 'season', ['spring', 'summer', 'autumn', 'winter']);
  pick('weather', 'weather', 'weather', ['clear', 'cloud', 'fog', 'rain', 'downpour', 'snow', 'petals']);
  pick('orb', '돌', 'orb', ['none', 'chair', 'bed', 'rug']);
  multi('layers', '장면', SCENE_LAYERS, (id) => !state.off.has(id),
        (id) => state.off.has(id) ? state.off.delete(id) : state.off.add(id));
  const props = BD_ART_PROPS.map((id) => [id, id.replace('bd-', '')]).concat([['bd-lamp', 'lamp']]);
  multi('props', '소품', props, (id) => !state.off.has(id),
        (id) => state.off.has(id) ? state.off.delete(id) : state.off.add(id));
  // 스탠드불 토글(별도)
  const lb = document.createElement('button');
  lb.textContent = state.lamp ? '스탠드불 ▲' : '스탠드불 ▽';
  lb.className = state.lamp ? 'on' : '';
  lb.onclick = () => { state.lamp = !state.lamp; refresh(); };
  document.getElementById('props').appendChild(lb);
  draw();
}
refresh();
</script>
